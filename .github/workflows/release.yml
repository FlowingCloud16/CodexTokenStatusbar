name: 发布版本

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths:
      - 'release/*.exe'
      - 'docs/releases/*.md'
      - '.github/workflows/release.yml'
      - 'tools/verify-release.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 获取版本文件
        # 固定 actions/checkout v7.0.1 的提交。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: 核对版本与成品摘要
        id: artifact
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$RELEASE_REF_TYPE" = "tag" ]]; then
            python3 tools/verify-release.py "$RELEASE_TAG"
          else
            python3 tools/verify-release.py
          fi

      - name: 发布下载文件
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.artifact.outputs.tag }}
          RELEASE_TARGET: ${{ github.sha }}
          RELEASE_ASSET: ${{ steps.artifact.outputs.asset }}
          RELEASE_NOTES: ${{ steps.artifact.outputs.notes }}
        run: |
          set -euo pipefail
          # 仅删除用户指定的旧版 Release，保留源码标签。
          old_id="$(gh release view v0.6.1 --json databaseId --jq .databaseId 2>/dev/null || true)"
          if [[ "$old_id" = "440409611" ]]; then
            gh release delete v0.6.1 --yes
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo '该版本已发布，保留现有下载文件。'
            exit 0
          fi
          gh release create "$RELEASE_TAG" "$RELEASE_ASSET" \
            --target "$RELEASE_TARGET" \
            --title "${RELEASE_TAG#v}" \
            --notes-file "$RELEASE_NOTES" \
            --latest
